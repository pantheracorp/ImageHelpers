name: release

# Builds the frozen Windows .exe.  PyInstaller cannot cross-compile -- it bundles the
# host interpreter and its compiled extension modules -- so this MUST run on a Windows
# runner (DESIGN.md sec 10.1).  That is the whole reason this workflow exists: it means
# nobody needs a Windows machine to cut a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project with freeze extra
        run: uv sync --extra dev --extra freeze

      - name: Tests must pass before we ship a binary
        run: uv run pytest -q

      - name: Build pids.exe
        run: uv run pyinstaller --clean --noconfirm packaging/pids.spec

      - name: Smoke test the binary
        # A frozen exe can import fine at build time and still fail at runtime on a
        # missing hidden import, so exercise the real entry point.
        run: |
          .\dist\pids.exe --version
          .\dist\pids.exe --help
          .\dist\pids.exe cameras --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pids-windows-x64
          path: dist/pids.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pids.exe
          body: |
            ### Install (recommended)

            ```powershell
            uv tool install git+https://github.com/${{ github.repository }}@${{ github.ref_name }}
            ```

            Then open a new terminal and run `pids --help`.

            ### Locked-down machines

            `pids.exe` below needs no Python and no installer. It is **unsigned**, so
            SmartScreen will warn on first run and some AV products may quarantine it.
            Prefer the `uv` install wherever you can install software.
