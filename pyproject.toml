[project]
name = "pids"
version = "0.1.0"
description = "PantheraIDS camera-trap image restructuring tool (Check/<CAxxx>/<MMDDYY>/)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.1"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Private :: Do Not Upload",
]

[project.scripts]
pids = "pids.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Only needed to produce the frozen Windows .exe; never installed on an operator
# machine that uses `uv tool install` (sec 10.1).
freeze = ["pyinstaller>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running scale or crash-injection tests"]
